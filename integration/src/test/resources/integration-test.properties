# Integration Test Configuration for AWS to Azure Migration
# Azure Function App Configuration
azure.function.base.url=https://authserver-functions.azurewebsites.net/api
azure.function.timeout=30000

# Test Client Credentials
test.client.id=test-client-id
test.client.secret=test-client-secret

# Azure AD B2C Configuration
azure.b2c.tenant.id=authserverb2c.onmicrosoft.com
azure.b2c.jwks.url=https://authserverb2c.b2clogin.com/authserverb2c.onmicrosoft.com/discovery/v2.0/keys?p=B2C_1_signupsignin

# Performance Test Configuration
performance.test.iterations=100
performance.test.p95.threshold=200
performance.test.cold.start.threshold=500

# Monitoring Configuration
azure.application.insights.connection.string=${APPLICATIONINSIGHTS_CONNECTION_STRING}
azure.monitor.workspace.id=${AZURE_MONITOR_WORKSPACE_ID}

# Test Environment Configuration
test.environment=integration
test.parallel.execution=true
test.retry.count=3

# Legacy Client Test Configuration
legacy.client.username=admin
legacy.client.password=password

# Error Rate Thresholds
error.rate.threshold=0.1
availability.threshold=99.9 